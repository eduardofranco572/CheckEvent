<div class="flex flex-col mb-5">
  @if (label) {
    <label class="block text-[0.6rem] font-bold tracking-widest text-gray-400 mb-2 uppercase">
      {{ label }}
    </label>
  }
  <div class="relative group">
    <input
      [type]="inputType"
      [placeholder]="placeholder"
      [value]="value"
      [disabled]="disabled"
      (input)="onInput($event)"
      (blur)="onTouched()"
      [ngClass]="{
        'bg-brand-surface': variant === 'default',
        'bg-brand-bg': variant === 'card',
      }"
      class="w-full border border-transparent focus:border-brand-pink rounded-xl px-4 py-3.5 outline-none text-white transition-all text-sm disabled:opacity-50"
    />

    @if (type === 'password') {
      <button
        type="button"
        (click)="togglePassword()"
        class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-white transition-colors outline-none cursor-pointer"
      >
        @if (showPassword) {
          <lucide-icon name="eye-off" class="w-5 h-5"></lucide-icon>
        } @else {
          <lucide-icon name="eye" class="w-5 h-5"></lucide-icon>
        }
      </button>
    }
  </div>
</div>
