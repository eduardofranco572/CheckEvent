<div class="mt-16">
  <h3 class="text-3xl font-bold text-white mb-6">Próximas celebrações</h3>
  <app-event-filter (filterChanged)="onFilterChanged($event)"></app-event-filter>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
    @for (event of events; track event.id) {
      <app-event-card [event]="event"></app-event-card>
    }

    @if (loading) {
      @for (i of skeletonItems; track i) {
        <div
          class="bg-brand-surface rounded-3xl overflow-hidden border border-brand-border h-[380px] flex flex-col shadow-lg animate-pulse"
        >
          <div class="h-56 w-full bg-brand-border/30"></div>

          <div class="p-6 flex flex-col flex-grow gap-4">
            <div class="w-16 h-3 bg-brand-border/50 rounded-full"></div>
            <div class="w-3/4 h-6 bg-brand-border/50 rounded-md mb-2"></div>
            <div class="w-full h-3 bg-brand-border/30 rounded-md"></div>
            <div class="w-5/6 h-3 bg-brand-border/30 rounded-md flex-grow"></div>

            <div class="flex justify-between items-center mt-6 pt-4 border-t border-brand-border">
              <div class="w-20 h-4 bg-brand-border/50 rounded-md"></div>
              <div class="w-16 h-4 bg-brand-border/50 rounded-md"></div>
            </div>
          </div>
        </div>
      }
    }
  </div>

  <div #scrollAnchor class="h-10 w-full bg-transparent"></div>

  @if (!loading && events.length === 0) {
    <div class="w-full py-16 flex flex-col items-center justify-center mt-8">
      <span class="text-gray-400 font-medium">Nenhum evento encontrado com esses filtros.</span>
    </div>
  }
</div>
