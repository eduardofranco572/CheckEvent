<div
  class="bg-brand-card rounded-3xl flex flex-col md:flex-row shadow-2xl items-stretch overflow-hidden"
>
  <div class="w-full md:w-[55%] min-h-[18rem] md:min-h-[21rem] relative select-none">
    <img
      [src]="storageUrl + '/uploads/eventos/' + event.id + '/img/' + event.banner"
      alt="Banner do Evento"
      class="absolute inset-0 w-full h-full object-cover"
    />
  </div>

  <div class="w-full md:w-[45%] p-8 flex flex-col justify-center">
    <span
      class="px-3 py-1 bg-brand-purple/20 text-primary text-[0.75rem] font-bold rounded-full uppercase tracking-widest mb-4 w-max select-none"
    >
      Destaque
    </span>

    <h2 class="text-3xl font-bold text-white mb-4">{{ event.name }}</h2>

    <p class="text-gray-400 text-sm mb-8 line-clamp-3">
      {{ event.description }}
    </p>

    <div class="flex flex-wrap items-center text-sm font-medium text-gray-300 mb-10">
      <span class="text-brand-pink text-xl leading-none mr-2">&bull;</span>

      <span> {{ event.date | date: "dd 'de' MMMM" }} &middot; {{ event.time | slice: 0 : 5 }}</span>

      <span class="text-brand-purple text-xl leading-none mx-3">&bull;</span>
      <span>{{ event.capacity }} Vagas</span>

      <span class="text-brand-purple text-xl leading-none mx-3">&bull;</span>
      <span>
        {{
          !event.price || event.price === '0' || event.price === '0.00'
            ? 'Gratuito'
            : 'R$ ' + event.price
        }}
      </span>
    </div>

    <button
      [routerLink]="['/evento', event.public_id]"
      class="px-8 py-3.5 rounded-full bg-gradient-to-r from-brand-pink to-brand-purple font-bold text-white hover:opacity-90 transition-opacity w-max cursor-pointer"
    >
      Quero me inscrever
    </button>
  </div>
</div>
