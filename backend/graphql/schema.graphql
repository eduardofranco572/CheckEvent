type Query {
    me: User @auth(guard: "sanctum")
}

type Mutation {
    signup(name: String!, email: String!, password: String!): String! @field(resolver: "App\\GraphQL\\Mutations\\Auth\\SignupMutation")
    login(email: String!, password: String!): String! @field(resolver: "App\\GraphQL\\Mutations\\Auth\\LoginMutation")
}

type User {
    id: ID!
    name: String!
    email: String!
    created_at: String!
    updated_at: String!
}